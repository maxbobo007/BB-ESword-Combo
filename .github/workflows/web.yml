name: web

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # 部署到 gh-pages 分支需要

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build web
        run: npm run web:build

      # 浏览器冒烟测试：持久化 / 浏览器后退 / 物理键盘 / 桌面布局 / 离线(PWA)
      - name: Smoke test
        run: CHROMIUM="$(which google-chrome)" npm run web:test
        env:
          SHOT_DIR: ${{ runner.temp }}/web-shots

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-shots

      # 发布到 GitHub Pages（gh-pages 分支）。仓库设置里需把 Pages 的来源设为 gh-pages 分支。
      - name: Deploy to gh-pages
        if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'claude/'))
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
