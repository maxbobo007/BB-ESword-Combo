name: android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布为 Release 的 tag（如 v0.2.0；留空则只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write # 打 v* tag 时创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest # 自带 Android SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # release 变体才会把 JS bundle 打进 APK（debug 变体需要连 Metro，装到手机无法独立运行）；
      # release 签名沿用 debug.keystore，适合个人安装，不适合上架
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: bb-esword-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 推送 v* tag 或手动触发填 release_tag 时，把 APK 发布为 Release asset（永久免登录直链）
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
