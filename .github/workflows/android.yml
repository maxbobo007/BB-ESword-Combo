name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 自带 Android SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # release 变体才会把 JS bundle 打进 APK（debug 变体需要连 Metro，装到手机无法独立运行）；
      # release 签名沿用 debug.keystore，适合个人安装，不适合上架
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: bb-esword-apk
          path: android/app/build/outputs/apk/release/app-release.apk
